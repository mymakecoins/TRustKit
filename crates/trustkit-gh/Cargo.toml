[package]
name = "trustkit-gh"
version = "0.1.0"
edition = "2024"
authors = ["TRustKit Contributors"]
description = "GitHub CLI and Git worktree adapter crate for TRustKit"

[dependencies]
trustkit-core = { path = "../trustkit-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.13"
