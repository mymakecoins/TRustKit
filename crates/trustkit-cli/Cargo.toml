[package]
name = "trustkit-cli"
version = "0.1.0"
edition = "2024"
authors = ["TRustKit Contributors"]
description = "TRustKit CLI binary, Composition Root, and POSIX boundary handler"

[lib]
name = "trustkit_cli"
path = "src/lib.rs"

[[bin]]
name = "trustkit"
path = "src/main.rs"

[dependencies]
trustkit-core = { path = "../trustkit-core" }
trustkit-ast = { path = "../trustkit-ast" }
trustkit-db = { path = "../trustkit-db" }
trustkit-gh = { path = "../trustkit-gh" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"
